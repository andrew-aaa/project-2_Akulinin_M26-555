[project]
name = "primitive-db"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andrey Akulinin", email = "akulinin-andrey2004@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "prompt-toolkit>=3.0.53",
]

[project.scripts]
project = "primitive_db.main:main"
database = "primitive_db.main:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
